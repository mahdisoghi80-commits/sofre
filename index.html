<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF5EF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="سفره" />
    <title>سفره — برنامه‌ریز هوشمند غذا و بودجه</title>
    <meta name="description" content="اپلیکیشن هوشمند برنامه‌ریزی وعده‌های غذایی ایرانی، مدیریت بودجه و لیست خرید خودکار با قابلیت اجرای بومی روی اندروید و آی‌او‌اس." />
    <meta property="og:title" content="سفره — برنامه‌ریز هوشمند غذا و بودجه" />
    <meta property="og:description" content="برنامه‌ریزی هفته غذایی، کنترل بودجه به تومان، لیست خرید یکپارچه و حالت آشپزی گام‌به‌گام." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/assets/fonts/fonts.css" />
    <script>
      (function () {
        try {
          var isDark = localStorage.getItem('sofreh_theme') === 'dark';
          if (!isDark) {
            var raw = localStorage.getItem('sofreh_app_state_v2');
            if (raw && raw.indexOf('"theme":"dark"') !== -1) isDark = true;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#161714');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FBF5EF] dark:bg-[#161714] text-[#292B25] dark:text-[#F5EFE8] antialiased selection:bg-[#F04438]/15 selection:text-[#C42F26]">
    <div id="root">
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;">
        <img src="/assets/brand/logo-mark-coral.png" alt="سفره" width="96" height="96" style="width:96px;height:96px;object-fit:contain;" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

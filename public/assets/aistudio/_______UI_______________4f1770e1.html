:root{--r:#F04438;--rd:#C42F26;--ink:#292B25;--mut:#8B8B8B;--bg:#FBF5EF;--tc:#C87955;--ol:#737D58;--gl:rgba(255,255,255,.66);--sh:0 10px 30px rgba(120,60,30,.14)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Peyda,Tahoma,sans-serif;color:var(--ink);background:#E9DED4;display:grid;place-items:center;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:relative;width:390px;height:min(844px,100vh);background:var(--bg);border-radius:44px;overflow:hidden;box-shadow:0 30px 80px rgba(80,40,20,.3),0 0 0 9px #1d1d1d}
@media(max-width:560px),(pointer:coarse){body{display:block;background:var(--bg)}#app{width:100%;max-width:560px;margin:0 auto;height:100vh;height:100dvh;border-radius:0;box-shadow:none}}
.sc{position:absolute;inset:0;overflow-y:auto;padding:54px 20px 130px;animation:in .35s cubic-bezier(.2,.8,.2,1)}
.sc::-webkit-scrollbar{display:none}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.gl{background:var(--gl);backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7);border:1px solid rgba(255,255,255,.8);box-shadow:var(--sh)}
.card{background:#fff;border-radius:26px;box-shadow:0 6px 22px rgba(120,60,30,.08)}
h1{font-size:30px;font-weight:800;line-height:1.35}h2{font-size:19px;font-weight:800}
.mut{color:var(--mut);font-size:13px}.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.btn{height:56px;border-radius:28px;background:var(--r);color:#fff;font-weight:800;font-size:17px;width:100%;box-shadow:0 10px 24px rgba(240,68,56,.35);transition:.15s}
.btn:active{transform:scale(.97)}.btn.g{background:#fff;color:var(--ink);box-shadow:none;border:1px solid #eadfd5}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.chip{padding:11px 16px;border-radius:20px;background:#fff;border:1.5px solid #efe3d8;font-size:14px;font-weight:600;transition:.15s}
.chip.on{background:var(--r);color:#fff;border-color:var(--r);transform:scale(1.04)}
.wrap{display:flex;flex-wrap:wrap;gap:10px}
.tb{position:absolute;bottom:20px;left:14px;right:14px;height:70px;border-radius:35px;display:flex;padding:7px;z-index:5}
.tb button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:#6b625a;border-radius:30px;transition:.25s}
.tb button.on{background:linear-gradient(160deg,#ff6a5c,var(--r));color:#fff;box-shadow:0 8px 20px rgba(240,68,56,.45);flex:1.25}
.top{position:absolute;top:0;left:0;right:0;height:54px;z-index:4}
.cb{width:42px;height:42px;border-radius:21px;display:grid;place-items:center}
.seg{display:flex;gap:5px;direction:rtl}.seg i{flex:1;height:5px;border-radius:3px;background:#ecdfd3}.seg i.on{background:var(--r)}
.days{display:flex;gap:7px;margin:16px 0}.d{flex:1;border-radius:20px;padding:10px 0;text-align:center;font-size:12px;color:var(--mut);background:#fff;font-weight:600;transition:.2s}
.d b{display:block;font-size:17px;color:var(--ink);margin-top:3px}.d.on{background:var(--r);color:#fff;transform:translateY(-3px);box-shadow:0 10px 20px rgba(240,68,56,.35)}.d.on b{color:#fff}
.d u{display:block;width:5px;height:5px;border-radius:3px;background:var(--r);margin:5px auto 0;opacity:.5}.d.on u{background:#fff}
.meal{display:flex;gap:12px;padding:10px;margin-bottom:12px;align-items:center}.meal img{width:88px;height:88px;border-radius:20px;object-fit:cover}
.tag{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:12px;background:#f6ece3;display:inline-flex;gap:4px;align-items:center}
.tag.r{background:#fde4e1;color:var(--rd)}
.bar{height:9px;border-radius:5px;background:#f1e5da;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#ff7a6c,var(--r));transition:width .5s}
.ticks{display:flex;gap:4px}.ticks i{flex:1;height:14px;border-radius:7px 7px 7px 2px;background:#f1e5da}.ticks i.on{background:var(--r)}
.hero{height:360px;margin:-54px -20px 0;position:relative;background-size:cover;background-position:center}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,var(--bg))}
.sheet{margin-top:-60px;position:relative;z-index:2}
.tabs{display:flex;background:#f3e8de;border-radius:22px;padding:4px}.tabs button{flex:1;padding:10px;border-radius:18px;font-weight:700;font-size:14px;color:var(--mut)}.tabs button.on{background:#fff;color:var(--r);box-shadow:0 3px 10px rgba(0,0,0,.08)}
.ing{display:flex;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid #f1e6dc;font-size:15px}.ing b{font-weight:800;direction:rtl}
.step{display:flex;gap:12px;padding:12px 0}.step .n{width:32px;height:32px;border-radius:16px;background:#fde4e1;color:var(--rd);display:grid;place-items:center;font-weight:800;flex:none}
.stp{display:flex;align-items:center;gap:8px;width:42px;justify-content:space-between}
.stp button{width:32px;height:32px;border-radius:16px;background:#fff;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.ck{width:26px;height:26px;border-radius:13px;border:2px solid #dccfc3;flex:none;display:grid;place-items:center;color:#fff;transition:.2s}.ck.on{background:var(--r);border-color:var(--r)}
.it{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid #f1e6dc}.it.dn .nm{text-decoration:line-through;color:var(--mut)}
.cta{position:absolute;bottom:22px;left:16px;right:16px;z-index:6}
.toast{position:absolute;bottom:104px;left:16px;right:16px;background:var(--ink);color:#fff;border-radius:22px;padding:14px 18px;display:flex;align-items:center;z-index:9;font-size:14px;animation:in .3s}
.toast button{color:#ff8a80;font-weight:800}
.big{font-size:23px;line-height:2;font-weight:600}.big b{color:var(--r);background:#fde4e1;border-radius:10px;padding:1px 8px;font-weight:800}
input[type=range]{width:100%;accent-color:var(--r);height:36px}
.lg{width:92px;filter:drop-shadow(0 8px 14px rgba(120,60,30,.25))}
.cell{padding:16px;border-radius:24px;background:#fff;display:flex;flex-direction:column;gap:8px}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:12px}.gr .card{overflow:hidden}.gr img{width:100%;height:120px;object-fit:cover}
.pulse{animation:pl 1.2s infinite}@keyframes pl{50%{opacity:.4}}

:root{--ab:Abar,Peyda,sans-serif}
h1,h2,.num,.d b{font-family:var(--ab)}h1{font-weight:900}
.sc>*:not(.cta):not(.top):not(.cb):not(.toast){animation:up .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
.sc.fw,.ob.fw{animation:fw .45s cubic-bezier(.2,.8,.2,1)}.sc.bk,.ob.bk{animation:bk .45s cubic-bezier(.2,.8,.2,1)}
.still,.still>*{animation:none!important}.still .nw{animation:flip .6s both!important}.still .res{animation:sheetUp .6s cubic-bezier(.2,.9,.3,1) both!important}
@keyframes up{from{opacity:0;transform:translateY(22px)}}@keyframes fw{from{opacity:0;transform:translateX(-40px)}}@keyframes bk{from{opacity:0;transform:translateX(40px)}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}}@keyframes flip{from{opacity:0;transform:rotateX(70deg) translateY(10px)}}
@keyframes draw{from{stroke-dasharray:0 1000}}@keyframes grow{from{width:0}}@keyframes tk{from{transform:scaleY(0)}}
@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}@keyframes fl{to{transform:translateY(16px)}}@keyframes kb{to{transform:scale(1.15) translate(-3%,2%)}}

<div class="tabs"><button class="${S.tab=='ing'?'on':''}" onclick="S.tab='ing';render()">مواد لازم</button><button class="${S.tab=='stp'?'on':''}" onclick="S.tab='stp';render()">مراحل پخت</button></div>
${!full?`<p class="mut" style="text-align:center;padding:30px 0">دستور کامل و پخت گام‌به‌گام این غذا در نسخهٔ بعد اضافه می‌شود.<br>الان قورمه‌سبزی کامل ساخته شده.</p>`:S.tab=='ing'?ING.map((x,i)=>`<div class="ing"><span class="ck ${S.done['i'+i]?'on':''}" onclick="S.done['i'+i]^=1;render()">${S.done['i'+i]?ic('ck',14):''}</span><span>${x[0]}</span><span class="sp"></span><b>${am(i)}</b></div>`).join(''):ST.map((x,i)=>`<div class="step"><span class="n">${F(i+1)}</span><div><b>${x[0]}</b>${x[2]?`<span class="tag r" style="margin-right:8px">${ic('clk',12)}${F(x[2]/60)} دقیقه</span>`:''}<p style="font-size:14px;line-height:1.9;margin-top:4px;color:#4b4741">${x[1].replace(/\{(\d)\}/g,(_,n)=>am(+n))}</p></div></div>`).join('')}</div>
${cb('back',"go('plan')",1).replace('cb ','cb top-b ').replace('<button','<button style="position:absolute;top:50px;right:18px;z-index:7"')}${cb('bm','toast(\'در علاقه‌مندی‌ها ذخیره شد\')',1).replace('<button','<button style="position:absolute;top:50px;left:18px;z-index:7"')}</div>
<div class="cta"><button class="btn" onclick="${full?'startCook()':"toast('به‌زودی')"}">${ic('play',18).replace('class="ic"','class="ic" style="fill:#fff;vertical-align:-3px;margin-left:8px;width:18px"')}شروع پخت</button></div>`};
function startCook(){S.step=0;resetT();go('cook')}
function resetT(){clearInterval(TO);const s=ST[S.step][2];T={left:s,tot:s,run:0}}
function tick(){if(T.run&&T.left>0){T.left--;if(!T.left){T.run=0;toast('وقتش شد! ⏰');}paintT()}}
function paintT(){const t=$('#tm');if(!t)return;const m=Math.floor(T.left/60),s=T.left%60;t.textContent=F(String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'));$('#rg').style.strokeDashoffset=(1-T.left/T.tot)*440;$('#tp').innerHTML=T.run?ic('pause',22):ic('play',22)}
function tgl(){T.run^=1;clearInterval(TO);if(T.run)TO=setInterval(tick,1000);paintT()}
function stp(d){S.step=Math.min(ST.length,Math.max(0,S.step+d));if(S.step<ST.length)resetT();else clearInterval(TO);render();}
V.cook=()=>{const st=ST[S.step];if(S.step>=ST.length)return`<div class="sc" style="display:grid;place-content:center;text-align:center;padding-bottom:40px"><div class="cf">${[...Array(18)].map((_,i)=>`<i style="left:${(i*37)%100}%;animation-delay:${(i%6)*.18}s;background:${['var(--r)','var(--tc)','var(--ol)','#F2B33D'][i%4]}"></i>`).join('')}</div><img class="lg" src="${I.logo}" style="margin:0 auto 20px;width:120px"><h1>نوش جان!</h1><p class="mut" style="margin:8px 0 26px">قورمه‌سبزی‌ات تموم شد</p><div class="row" style="justify-content:center;gap:16px;margin-bottom:26px"><button class="cb card" style="width:62px;height:62px;border-radius:31px">${ic('up',26)}</button><button class="cb card" style="width:62px;height:62px;border-radius:31px;transform:rotate(180deg)">${ic('up',26)}</button></div><button class="btn" onclick="toast('ثبت شد؛ از انبار کم شد');go('plan')">ثبت به‌عنوان پخته‌شده</button></div>`;
const k=S.sv/4,am=i=>`<b>${F(Math.round(ING[i][1]*k*10)/10)} ${ING[i][2]}</b>`,ids=[...new Set([...st[1].matchAll(/\{(\d)\}/g)].map(m=>+m[1]))];
return`<div class="sc" style="padding-bottom:150px">${hd(cb('x',"go('rec')",0),'')}<div style="margin-top:6px"><div class="mut" style="margin-bottom:8px">مرحلهٔ ${F(S.step+1)} از ${F(ST.length)}</div><div class="seg">${ST.map((_,i)=>`<i class="${i<=S.step?'on':''}"></i>`).join('')}</div></div><h1 style="margin:26px 0 6px;font-size:32px">${st[0]}</h1><p class="big">${st[1].replace(/\{(\d)\}/g,(_,n)=>am(+n))}</p>
${ids.length?`<div class="wrap" style="margin-top:10px">${ids.map(i=>`<span class="tag" style="padding:8px 12px;font-size:13px;background:#fff">${ING[i][0]} · ${F(Math.round(ING[i][1]*k*10)/10)}</span>`).join('')}</div>`:''}
${st[2]?`<div class="card" style="margin-top:22px;padding:22px;display:flex;align-items:center;gap:18px"><div style="position:relative;width:104px;height:104px"><svg width="104" height="104" viewBox="0 0 160 160" style="transform:rotate(-90deg)"><circle cx="80" cy="80" r="70" fill="none" stroke="#f3e6dc" stroke-width="12"/><circle id="rg" cx="80" cy="80" r="70" fill="none" stroke="var(--r)" stroke-width="12" stroke-linecap="round" stroke-dasharray="440" stroke-dashoffset="0" style="transition:stroke-dashoffset 1s linear"/></svg><b id="tm" style="position:absolute;inset:0;display:grid;place-items:center;font-size:20px"></b></div><div class="sp"><b>تایمر این مرحله</b><div class="row" style="margin-top:12px"><button class="cb" id="tp" style="background:var(--r);color:#fff;width:50px;height:50px;border-radius:25px" onclick="tgl()"></button><button class="chip" onclick="T.left+=60;T.tot+=60;paintT()">+ ۱ دقیقه</button></div></div></div>`:''}
${st[3]?`<div class="gl" style="margin-top:16px;padding:16px;border-radius:22px;display:flex;gap:10px;font-size:14px;line-height:1.8"><span style="color:var(--r)">${ic('fire',20)}</span>${st[3]}</div>`:''}</div>
<div class="tb gl" style="padding:8px;gap:8px;bottom:22px"><button class="cb" style="background:#fff;width:54px;flex:none;color:var(--ink)" onclick="stp(-1)">${ic('back',20).replace('M9 5l7 7-7 7','M9 5l7 7-7 7')}</button><button class="btn" style="flex:1;height:54px" onclick="stp(1)">${S.step==ST.length-1?'تمام شد':'مرحلهٔ بعد'}</button></div></div>`};
setTimeout(()=>paintT(),0);
V.shop=()=>{const tot=L.reduce((s,x,i)=>s+(S.done['s'+i]?0:x[2]),0),keys=[...new Set(L.map(x=>x[S.grp=='a'?3:4]))],row=(x,i)=>`<div class="it ${S.done['s'+i]?'dn':''}" onclick="S.done['s${i}']^=1;render()"><span class="ck ${S.done['s'+i]?'on':''}">${S.done['s'+i]?ic('ck',14):''}</span><div class="sp nm"><b>${x[0]}</b><div class="mut" style="font-size:12px">${x[1]}</div></div><span class="mut">${x[2]?N(x[2]):'—'}</span></div>`;
return`<div class="sc"><h1>چی باید بخری؟</h1><div class="card gl" style="padding:18px;margin:16px 0;background:var(--gl);display:flex;align-items:center;gap:14px"><div class="sp"><div class="mut">جمع باقی‌مانده</div><div style="font-size:26px;font-weight:800">${N(tot)} <span style="font-size:14px">تومان</span></div></div><div class="cb" style="background:var(--r);color:#fff;width:50px;height:50px;border-radius:25px">${ic('cart')}</div></div><div class="tabs" style="margin-bottom:8px"><button class="${S.grp=='a'?'on':''}" onclick="S.grp='a';render()">بر اساس قفسه</button><button class="${S.grp=='r'?'on':''}" onclick="S.grp='r';render()">بر اساس غذا</button></div>${keys.map(g=>`<div class="card" style="padding:6px 16px;margin-top:12px"><div class="mut" style="padding:10px 0 0;font-weight:700">${g}</div>${L.map((x,i)=>x[S.grp=='a'?3:4]==g?row(x,i):'').join('')}</div>`).join('')}</div>`};
const grid=()=>Object.entries(R).filter(([_,r])=>(S.f=='all'||(S.f=='q'&&r.t<=80)||(S.f=='p'&&r.p>=38)||(S.f=='e'&&r.$<=80000))&&r.n.includes(S.q)).map(([id,r])=>`<div class="card" style="${bad(id).length?'opacity:.55':''}" onclick="S.rid='${id}';S.tab='ing';go('rec')"><img src="${I[r.i]}"><div style="padding:12px"><b style="font-size:15px">${r.n}</b><div class="mut" style="font-size:12px;margin-top:3px">${bad(id).length?'حاوی '+bad(id)[0]:F(r.t)+' دقیقه · '+F(r.p)+'گ پروتئین'}</div></div></div>`).join('')||'<p class="mut" style="grid-column:1/3;text-align:center;padding:30px">چیزی پیدا نشد</p>';
V.book=()=>`<div class="sc"><h1>آشپزی</h1><input class="inp" style="margin:16px 0 12px" placeholder="دنبال چی می‌گردی؟" value="${S.q}" oninput="S.q=this.value;$('#gd').innerHTML=grid()"><div class="wrap" style="margin-bottom:16px">${[['all','همه'],['q','سریع'],['p','پروتئین بالا'],['e','اقتصادی']].map(([k,n])=>`<button class="chip ${S.f==k?'on':''}" onclick="S.f='${k}';render()">${n}</button>`).join('')}</div><div class="gr" id="gd">${grid()}</div></div>`;
const swt=k=>`<button class="swh ${S.sw[k]?'on':''}" onclick="S.sw['${k}']^=1;this.classList.toggle('on')"><i></i></button>`,FM={sv:x=>F(x)+' پرس',kc:x=>N(x),pt:x=>F(x)+' گ'};
function bump(k,d,lo,hi){S[k]=Math.min(hi,Math.max(lo,S[k]+d));$('#s_'+k).textContent=FM[k](S[k])}
const st2=(k,d,lo,hi)=>`<div class="stp" style="width:130px"><button onclick="bump('${k}',${-d},${lo},${hi})">${ic('min',14)}</button><b id="s_${k}" style="min-width:48px;text-align:center">${FM[k](S[k])}</b><button onclick="bump('${k}',${d},${lo},${hi})">${ic('plus',14)}</button></div>`;
V.me=()=>{const A=['بادام‌زمینی','آجیل','لبنیات','تخم‌مرغ','گلوتن','سویا','ماهی','میگو','کنجد'],DT=['بدون محدودیت','گیاهخواری','کم‌کربو','پروتئین بالا'],K=[['ov','اجاق'],['fr','فر'],['zp','زودپز'],['af','ایرفرایر']];
return`<div class="sc"><div class="gl card" style="padding:22px 16px;text-align:center;border-radius:32px;background:linear-gradient(160deg,#fff,#fde4e1)"><img class="lg" src="${I.logo}" style="width:96px"><h2 style="margin:6px 0 16px;font-size:22px">سفرهٔ خانواده</h2><div class="row"><div class="stat"><b data-cu="12">0</b><span class="mut">غذا پخته شد</span></div><div class="stat"><b data-cu="4">0</b><span class="mut">هفته پشت‌سرهم</span></div><div class="stat"><b data-cu="8">0</b><span class="mut">دستور ذخیره</span></div></div></div>
<div class="sec">سفرهٔ من</div><div class="card pr"><div class="row"><b class="sp">سرِ سفره</b>${st2('sv',1,1,10)}</div><div class="row" style="margin-top:12px"><b class="sp">هدف کالری روزانه</b>${st2('kc',100,1200,3500)}</div><div class="row" style="margin-top:12px"><b class="sp">هدف پروتئین</b>${st2('pt',5,40,200)}</div><div class="row" style="margin-top:16px"><b class="sp">بودجهٔ هفتگی</b><b class="num" style="color:var(--r)" id="bm">${N(S.bd*1e5)}</b></div><input type="range" min="10" max="150" value="${S.bd}" oninput="S.bd=+this.value;$('#bm').textContent=N(S.bd*1e5)"></div>
<div class="sec">حساسیت‌ها <span class="mut" style="font-size:12px">(<span id="alc">${F(S.al.length)}</span> فعال)</span></div><div class="card pr"><div class="wrap">${A.map(a=>`<button class="chip al ${S.al.includes(a)?'on':''}" style="padding:9px 14px" onclick="tg(this,'al','${a}')">${a}</button>`).join('')}</div><p class="mut" style="margin-top:12px;font-size:12px">غذاهای حاوی این مواد خودکار از برنامه کنار می‌روند.</p></div>
<div class="sec">رژیم</div><div class="wrap">${DT.map((d,i)=>`<button class="chip dt ${S.dt==i?'on':''}" onclick="S.dt=${i};document.querySelectorAll('.dt').forEach((e,j)=>e.classList.toggle('on',j==${i}))">${d}</button>`).join('')}</div>
<div class="sec">وسایل آشپزخانه</div><div class="card pr">${K.map(([k,n])=>`<div class="row"><b class="sp">${n}</b>${swt(k)}</div>`).join('')}</div>
<div class="sec">یادآورها</div><div class="card pr"><div class="row"><div class="sp"><b>خرید پنجشنبه‌شب</b><div class="mut" style="font-size:12px">لیست خرید رو بفرستم؟</div></div>${swt('r1')}</div><div class="row" style="margin-top:12px"><div class="sp"><b>خیساندن از شب قبل</b><div class="mut" style="font-size:12px">مثل لوبیا و نخود</div></div>${swt('r2')}</div></div>
<div class="card" style="margin-top:20px;padding:18px;background:linear-gradient(120deg,#292B25,#4a352d);color:#fff"><b style="font-family:var(--ab);font-size:18px">دورهٔ آزمایشی</b><div style="color:#d9c9bf;font-size:13px;margin:4px 0 14px">۵ روز دیگه مونده؛ همهٔ قابلیت‌ها بازه</div><button class="btn" style="height:48px;font-size:15px" onclick="toast('پلن‌ها — به‌زودی')">دیدن پلن‌ها</button></div>
<button class="btn g" style="margin-top:14px" onclick="go('ob0')">دوباره راه‌اندازی کن</button></div>`};
render();
</script></body></html>
